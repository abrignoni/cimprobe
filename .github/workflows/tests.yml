name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      # python-cim's test repositories (Apache-2.0), pinned to the commit cimprobe was
      # ported from; tests/test_python_cim_reference.py reproduces its recorded figures.
      - name: Fetch python-cim's test repositories
        shell: bash
        run: |
          set -euo pipefail
          sha=b0a5a094ff9ca7d7a1c4fc711dc00c74dec4b6b1
          for f in xp/mapping-only/MAPPING1.MAP win7/deleted-instance/INDEX.BTR \
                   win7/deleted-instance/MAPPING1.MAP win7/deleted-instance/MAPPING2.MAP \
                   win7/deleted-instance/MAPPING3.MAP win7/deleted-instance/OBJECTS.DATA; do
            mkdir -p "pycim-repos/$(dirname "$f")"
            curl -sSfL --retry 3 -o "pycim-repos/$f" \
              "https://raw.githubusercontent.com/mandiant/flare-wmi/$sha/python-cim/tests/repos/$f"
          done
      - run: python -m pytest tests -q -rs
        env:
          CIMPROBE_PYCIM_REPOS: pycim-repos
          CIMPROBE_REQUIRE_PYCIM_REPOS: "1"
